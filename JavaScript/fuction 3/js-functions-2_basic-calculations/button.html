<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo</title>
  </head>
  <body>
    <button
      type="button"
      id="myBtn"
      style="background-color: grey; font-size: x-large"
    >
      Submit
    </button>
  </body>
  <script>
    const myBtn = document.getElementById("myBtn");

    function sayhello(e) {
      console.log("Hello Kwanele");
    }
    myBtn.addEventListener("click", sayhello);
  </script>
</html>
